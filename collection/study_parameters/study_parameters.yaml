# Study-design constants for the between-group corpus collection methodology:
# temporal boundaries, quality-filter thresholds, and sampling parameters.
# Kept as data here, not hardcoded in collection/config.py, so a reviewer has
# one place to find every numeric/date parameter that shapes the study.
# See docs/architecture/configuration.md for how each is used downstream.

# Temporal boundaries
human_corpus_cutoff_date: "2020-12-31" # Dataset C: pre-agent-era snapshot
agent_corpus_start_date: "2025-01-01" # Datasets A/B: agent-availability window
dataset_c_min_created_date: "2016-01-01" # Dataset C: lower bound of repo creation-date window

# Shallow-clone bound: --shallow-since=<since_date - this many days> when a
# clone site only needs commits since some in-scope date (see
# clone_primitives.py::_shallow_clone_is_truncated for the safety check that
# makes this trustworthy). Empirically zero discrepancy at 0 buffer days
# across a 24-repo stratified sample; a few days' slack costs nothing.
shallow_clone_buffer_days: 7

# Quality thresholds applied to every collected repo
min_stars: 500
min_commits: 100
min_test_files: 5
min_fixtures_found: 1 # repos where we detect zero fixtures are dropped

# Dataset C only: every candidate already comes from SEART GHS
# (github-search-raw/), pre-filtered at *source* to >=5k non-blank LOC --
# but that filter uses today's crawl-time GitHub metadata, not the repo's
# real state at its own pre-2021 cutoff snapshot (same survivorship-bias
# problem already fixed for min_commits/min_test_files above, which
# dataset_c.py re-measures honestly from the repo's real git history at
# its cutoff commit instead of trusting live/source-crawl values -- see
# internal-docs/methodology-improvements/dataset-c-repo-selection.md).
# This closes the same gap for LOC. Unlike min_stars (no historical star
# time series exists at all, so that filter was dropped rather than
# re-measured -- see dataset-card.md's Known Limitations), LOC *is*
# derivable from the pinned cutoff commit's own tree.
min_non_blank_loc: 5000

# Sampling
target_repos_per_language_between_group: 500
dataset_c_sampling_seed: 42 # overridable via the DATASET_C_SAMPLING_SEED env var
