# Operational definition of "test fixture" per language -- exactly what
# collection/detector_<language>.py treats as a fixture definition, and why.
#
# This file is both:
#   1. Executable source of truth -- loaded by collection/config_data
#      (load_fixture_definitions()) and consumed by the detector modules to
#      build their pattern tables. Editing a name/annotation/scope here is a
#      YAML change, not a Python change.
#   2. The audit trail for reviewers -- the `excluded` list per language
#      documents known boundary cases the detector deliberately does not (or
#      cannot) catch, so absence of a pattern is a documented decision, not
#      an oversight.
#
# Scope values (shared vocabulary across all languages):
#   per_test   -- runs before/after every test function
#   per_class  -- runs once per test class/suite
#   per_module -- runs once per file/module
#   global     -- runs once per test session (pytest scope="session"), or,
#                 for TestNG's suite/test/groups-level hooks (@BeforeSuite/
#                 @BeforeTest/@BeforeGroups and their After* counterparts),
#                 the closest available approximation -- all three run at a
#                 broader-than-class granularity with no finer bucket in
#                 this 4-value vocabulary to distinguish them by.
#
# Async fixtures: captured identically to sync ones, in every language.
# The lifecycle hook name / decorator / annotation is the detection signal,
# not the function's async qualifier -- `async def` (Python), `async () =>`
# / `async function` (JS/TS call-expression hooks), and `async` class
# methods (TS decorator-style hooks) are all transparent to the matchers
# below. See python.pytest_decorator's note for the @pytest_asyncio.fixture
# case specifically, and the TestAsync* test classes in
# tests/collection/test_extractor_unit/ for the coverage that verifies this.

python:
  pytest_decorator:
    framework: pytest
    fixture_type: pytest_decorator
    # Decorator text must match this regex, not just contain "pytest" and
    # "fixture" as independent substrings anywhere -- that looser check
    # also matched @pytest.mark.usefixtures(...) ("fixture" comes from
    # "usefixtures") and @pytest.mark.parametrize(..., lazy_fixture(...))
    # ("fixture" comes from "lazy_fixture" in the argument list), both real
    # test-function markers, not fixture definitions.
    match_pattern: 'pytest\w*\.fixture\b'
    note: >
      Matches @pytest.fixture and @pytest_asyncio.fixture alike ("fixture"
      immediately follows "pytest" or "pytest_asyncio") -- pytest_asyncio
      fixtures are not a separate fixture_type. A factory fixture (a
      @pytest.fixture-decorated function that returns a callable) is
      detected once, as the outer function; the callable it returns is not
      treated as a second fixture.
    scope_keyword_map:
      function: per_test
      class: per_class
      module: per_module
      package: per_module
      session: global
    default_scope: per_test  # used when no explicit scope=... kwarg is present
  unittest_setup:
    framework: unittest
    fixture_type: unittest_setup
    names:
      setUp: per_test
      tearDown: per_test
      setUpClass: per_class
      tearDownClass: per_class
      setUpModule: per_module
      tearDownModule: per_module
      # IsolatedAsyncioTestCase's own async lifecycle hooks -- distinct
      # method names the framework calls in addition to (not instead of)
      # setUp/tearDown: setUp() -> asyncSetUp() -> test -> asyncTearDown()
      # -> tearDown(). https://docs.python.org/3/library/unittest.html#unittest.IsolatedAsyncioTestCase.asyncSetUp
      asyncSetUp: per_test
      asyncTearDown: per_test
  pytest_class_method:
    framework: pytest
    fixture_type: pytest_class_method
    note: >
      pytest-style TestCase subclasses using setup_method/teardown_method
      naming instead of setUp/tearDown.
    names:
      setup_method: per_test
      teardown_method: per_test
      setup_class: per_class
      teardown_class: per_class
  excluded:
    - case: "Fixtures defined in installed pytest plugins / external packages"
      reason: >
        Detection is per-file AST scanning of the cloned repo; a fixture
        registered via pytest_plugins pointing at an installed package has
        no source file in the repo to scan.
    - case: "Custom decorators that wrap @pytest.fixture internally (e.g. @my_fixture_wrapper)"
      reason: >
        Matching is a literal pattern check on the decorator's own text
        (must match match_pattern, i.e. contain "pytest.fixture" or
        "pytest_asyncio.fixture"); a differently-named decorator whose
        *implementation* calls pytest.fixture() internally does not itself
        contain that pattern at the call site and is
        missed.
    - case: "Fixtures created dynamically (metaprogramming, exec(), runtime-generated decorators)"
      reason: >
        AST-based detection requires the fixture to exist as literal source
        text; there is no corresponding node for code that only exists at
        runtime.
    - case: "mock.patch (or any other non-fixture decorator) on an ordinary test function"
      reason: >
        Not a fixture and not matched by design -- listed here to make the
        boundary explicit rather than leave it implicit.
    - case: "nose/nose2 setup()/teardown()/setup_module()/etc. (no decorator/annotation, bare names)"
      reason: >
        Scope decision: only the dominant, actively-maintained testing
        frameworks per language are covered (pytest and unittest for
        Python) -- nose has been unmaintained/deprecated for years and
        adding it back reopens the question of where the line is for every
        other niche framework, which isn't answerable. See java's Spring/
        Cucumber exclusions below for the same reasoning applied to Java.
    - case: "Behave BDD step decorators (@given/@when/@then/@step)"
      reason: >
        Same scope decision as nose above: Behave is a BDD framework, not
        one of Python's two dominant testing frameworks (pytest, unittest).

java:
  # `family` is a finer-grained label than `framework` (distinguishes
  # junit4 from junit5, both of which report framework: junit); `framework`
  # is the value actually recorded on the FixtureResult.
  annotations:
    "@BeforeEach": {fixture_type: junit5_before_each, scope: per_test, family: junit5, framework: junit}
    "@BeforeAll": {fixture_type: junit5_before_all, scope: per_class, family: junit5, framework: junit}
    "@AfterEach": {fixture_type: junit5_after_each, scope: per_test, family: junit5, framework: junit}
    "@AfterAll": {fixture_type: junit5_after_all, scope: per_class, family: junit5, framework: junit}
    "@Before": {fixture_type: junit4_before, scope: per_test, family: junit4, framework: junit}
    "@After": {fixture_type: junit4_after, scope: per_test, family: junit4, framework: junit}
    "@BeforeMethod": {fixture_type: testng_before_method, scope: per_test, family: testng, framework: testng}
    "@AfterMethod": {fixture_type: testng_after_method, scope: per_test, family: testng, framework: testng}
    "@DataProvider": {fixture_type: testng_data_provider, scope: per_test, family: testng, framework: testng}
    "@Factory": {fixture_type: testng_factory, scope: per_test, family: testng, framework: testng}
    "@BeforeSuite": {fixture_type: testng_before_suite, scope: global, family: testng, framework: testng}
    "@AfterSuite": {fixture_type: testng_after_suite, scope: global, family: testng, framework: testng}
    "@BeforeTest": {fixture_type: testng_before_test, scope: global, family: testng, framework: testng}
    "@AfterTest": {fixture_type: testng_after_test, scope: global, family: testng, framework: testng}
    "@BeforeGroups": {fixture_type: testng_before_groups, scope: global, family: testng, framework: testng}
    "@AfterGroups": {fixture_type: testng_after_groups, scope: global, family: testng, framework: testng}
    "@Rule": {fixture_type: junit_rule, scope: per_test, family: junit4, framework: junit}
    "@ClassRule": {fixture_type: junit_class_rule, scope: per_class, family: junit4, framework: junit}
  # @Factory supplies test-class instances (data-driven class
  # instantiation), the same "supplies inputs rather than doing setup/
  # teardown" role @DataProvider plays -- fixture_role classification
  # (detector_shared.py) falls through to 'other' for both by construction
  # (neither is in feature_extraction_patterns.yaml's type_based_pairs),
  # same scope value (per_test) for consistency, not because either
  # mapping is a precise fit. No JUnit collision risk for this name, so
  # (unlike @BeforeClass/@AfterClass below) it needs no import-based
  # disambiguation.
  #
  # Same annotation name exists in both JUnit4 and TestNG for @BeforeClass/
  # @AfterClass; the detector resolves it per-file by checking which of
  # org.junit.*/org.testng.* is imported (detector_java.py's
  # _detect_test_framework_imports()) -- see ambiguous_annotations below
  # for the three possible outcomes. fixture_role (setup/teardown) is
  # unaffected either way: all three possible fixture_type values below
  # are wired into feature_extraction_patterns.yaml's type_based_pairs, so
  # framework ambiguity never blocks correct setup/teardown classification,
  # only the framework-specific fixture_type label.
  ambiguous_annotations:
    "@BeforeClass": {junit4_fixture_type: junit4_before_class, testng_fixture_type: testng_before_class, ambiguous_fixture_type: before_class_ambiguous, scope: per_class}
    "@AfterClass": {junit4_fixture_type: junit4_after_class, testng_fixture_type: testng_after_class, ambiguous_fixture_type: after_class_ambiguous, scope: per_class}
  # Plain setUp()/tearDown() methods with no annotation at all, inside a
  # (JUnit3-style) TestCase subclass.
  junit3_fallback:
    names:
      setUp: junit3_setup
      tearDown: junit3_teardown
    scope: per_test
    framework: junit
  known_imprecisions:
    - >
      @BeforeClass/@AfterClass resolve to the ambiguous_fixture_type
      (framework left unresolved/null) whenever the file has both an
      org.junit.* and an org.testng.* import, or neither -- e.g. a file
      that only uses TestNG assertions/annotations elsewhere without ever
      importing org.testng.annotations.BeforeClass/AfterClass by that
      exact name, or a file mixing both frameworks. Measured (2026-09-06)
      against known-TestNG-adjacent Java files: ~0% of Dataset A's sample,
      ~5% of Dataset C's sample fall into this dual-or-neither-import
      case. fixture_role is still correctly setup/teardown in every
      case (see the comment above ambiguous_annotations) -- only the
      framework-specific fixture_type/framework fields are affected.
    - >
      Fixture scope is inferred from annotation type (@BeforeAll ->
      per_class, @BeforeEach -> per_test). JUnit 5's instance lifecycle
      annotation (@TestInstance(Lifecycle.PER_CLASS)), which can modify the
      effective scope of @BeforeAll (allowing it to be a non-static,
      per-instance method shared across the class's tests instead of a
      true static per-class hook), is not currently accounted for.
    - >
      TestNG @BeforeSuite/@AfterSuite/@BeforeTest/@AfterTest/@BeforeGroups/
      @AfterGroups are all mapped to scope: global, the closest available
      approximation -- see the scope vocabulary comment at the top of this
      file. The three levels (suite/test/groups) are not distinguished
      from each other or from pytest's session scope; no finer-grained
      scope value exists in the current vocabulary to do so.
  excluded:
    - case: "JUnit 5 Extension lifecycle methods (BeforeEachCallback, AfterEachCallback, etc.)"
      reason: >
        These are implemented via interfaces, not annotations -- the
        detector only looks for annotation nodes on methods/fields.
    - case: "TestNG @Listeners"
      reason: >
        Class-level listener registration (e.g. @Listeners(MyListener.class)
        on the class declaration itself), not a setup/teardown method or
        data-supplying method -- doesn't fit this project's fixture
        definition at all. Also structurally never reachable even if it
        were added to the annotation table: the detector only inspects
        annotations on method_declaration/field_declaration nodes, never
        on the enclosing class_declaration itself.
    - case: "Spring (all annotations, e.g. @Bean, @TestConfiguration, @BeforeTransaction/@AfterTransaction)"
      reason: >
        Scope decision: only the dominant, actively-maintained testing
        frameworks per language are covered (JUnit and TestNG for Java).
        Spring is a dependency-injection framework, not a testing
        framework. Its test-context annotations are not included,
        but there is no principled place to stop once one non-testing
        framework's own conventions are in scope -- every other framework
        that projects layer on top of JUnit/TestNG would have an equally
        valid claim to inclusion. See python's nose/Behave exclusions above
        for the same reasoning applied to Python.
    - case: "Cucumber (all annotations, e.g. @Given, @When, @Then, @And, @But, @Attachment)"
      reason: >
        Same scope decision as Spring above: Cucumber is a BDD framework,
        not JUnit or TestNG.

javascript_typescript:
  # Matched purely on the call's function name -- `beforeEach(async () =>
  # {...})` matches the same as `beforeEach(() => {...})` since `async` only
  # qualifies the callback argument, not the call_expression itself (see the
  # top-of-file "Async fixtures" note).
  #
  # Only Jest, Mocha, and Vitest are in scope (Jasmine shares these exact
  # bare hook names too, so it rides along for free; AVA and TS decorator-
  # style hooks are out of scope -- see excluded below). beforeEach/
  # beforeAll/afterEach/afterAll are ambiguous by design: could be any of
  # the three, so no framework attribution is attempted. before/after are
  # attributed to Mocha specifically via their fixture_type name (Jest/
  # Vitest don't document bare before/after as hooks). aroundEach/aroundAll
  # are Vitest-only (added in Vitest 4.1) but kept unattributed here too,
  # for consistency with the rest of this table.
  hooks:
    beforeEach: {fixture_type: before_each, scope: per_test}
    beforeAll: {fixture_type: before_all, scope: per_class}
    afterEach: {fixture_type: after_each, scope: per_test}
    afterAll: {fixture_type: after_all, scope: per_class}
    before: {fixture_type: mocha_before, scope: per_test, note: "Mocha's bare `before` is suite-scoped; approximated as per_test here, same as the other ambiguous bare hooks."}
    after: {fixture_type: mocha_after, scope: per_test}
    aroundEach: {fixture_type: vitest_around_each, scope: per_test, note: "Vitest 4.1+. Wraps setup+teardown around a single test via a runTest() callback: aroundEach(async (runTest) => { ...; await runTest(); ...; })."}
    aroundAll: {fixture_type: vitest_around_all, scope: per_class, note: "Vitest 4.1+. Wraps setup+teardown around a whole suite via a runSuite() callback."}
  excluded:
    - case: "Jest globalSetup / globalTeardown"
      reason: >
        Configured as a file path in jest.config.js, not an inline function
        call in the test file -- there is no call-expression node to match.
    - case: "Vitest setupFiles"
      reason: "Configuration-level (vitest.config.*), not an inline fixture -- same reasoning as Jest globalSetup."
    - case: "Custom test helpers not using a recognized framework lifecycle hook name"
      reason: >
        Detection is a fixed name/pattern lookup (hooks above); a
        hand-rolled helper called manually inside each test body is not a
        lifecycle hook and is not matched.
    - case: "Vitest onTestFinished / onTestFailed"
      reason: >
        Real, documented Vitest hooks, but a structurally different shape
        from everything else in this table: they're methods called from
        inside a test body off the test's own context parameter (e.g.
        `test('x', ({ onTestFinished }) => { onTestFinished(() => {...}) })`),
        not a top-level call-expression in a describe block. Detecting this
        correctly would mean distinguishing it from an unrelated function
        that happens to share the name, and handling both the destructured-
        parameter and `context.onTestFinished(...)` call styles -- not
        implemented yet.
    - case: "AVA (test.before/test.after/test.serial.before/test.serial.after)"
      reason: >
        Scope decision: only the dominant, actively-maintained testing
        frameworks are covered (Jest, Mocha, Vitest for JS/TS -- see the
        `hooks` comment above). AVA's npm download share is roughly 1% of
        Jest's and under Jasmine's, putting it in the same tier as
        nose/Behave/Spring/Cucumber, already excluded for Python/Java for
        the same reason: once one non-dominant framework's own conventions
        are in scope, there's no principled place to stop.
    - case: "QUnit (hooks.beforeEach/hooks.afterEach inside QUnit.module(...), or beforeEach/afterEach/setup/teardown properties in a module options object)"
      reason: >
        Same scope decision as AVA above: only Jest, Mocha, and Vitest are
        covered. Also structural, independent of scope: QUnit's modern
        hooks are always qualified off a `hooks` parameter
        (`hooks.beforeEach(...)`), not a bare `beforeEach(...)` call, so
        they wouldn't match this table's bare hook names even if QUnit
        were brought into scope; and both the modern options-object style
        (`{ beforeEach: fn }`) and QUnit's older pre-hooks API
        (`{ setup: fn, teardown: fn }`) are object properties assigned as
        `QUnit.module(name, {...})`'s second argument, not call
        expressions -- there is no call-expression node for this detector
        to match regardless of name.
    - case: "TypeScript decorator-style hooks (@Before/@After/@BeforeEach/@AfterEach/@BeforeAll/@AfterAll on class methods)"
      reason: >
        Removed after verifying no currently real, actively-used package
        provides this exact decorator convention: mocha-typescript (the
        obvious candidate) is formally deprecated, its successor
        @testdeck/mocha only provides @suite/@test (setup/teardown via
        plain methods, not decorators), and the one package matching this
        naming (testyts) is functionally dead (~56 weekly downloads, last
        published 2021). Unlike AVA (a real but smaller framework), this
        pattern didn't correspond to any live ecosystem at all.
