# RQ5 (Agent Configuration Files) keyword catalog -- test-related and
# fixture-related terms searched for inside root-level agent configuration
# files (AGENTS.md, CLAUDE.md, ...). Not consumed by the main agent/fixture
# detection pipeline (collection/heuristics/__init__.py's loaders) -- this is
# RQ5's own, independent catalog, loaded directly by
# collection/rq5_agent_file_scan.py::load_rq5_keyword_catalog(). Kept here,
# alongside the project's other detection-heuristic catalogs, purely by
# convention (same "pattern/keyword table drives a classification decision"
# shape), not because it feeds the same loader.
#
# `version` bumps on any edit to `target_files`/`test_keywords`/
# `fixture_keywords` below, so the paper can cite exactly which catalog
# version produced a given collection run (also persisted per-repo as
# `catalog_version` in db/rq5_agent_files.db's `repo_scan` table).
#
# Matching rules (collection/rq5_agent_file_scan.py::_build_keyword_pattern()):
#   - Case-insensitive, word-boundary-respecting (e.g. "test" never matches
#     "latest"/"contest"/"attestation").
#   - A multi-word term (keyword containing a literal space) accepts a
#     space, a hyphen, or no separator between its words -- e.g. "test
#     setup" also matches "test-setup"/"testsetup". This is deliberately
#     NOT extended to camelCase terms (e.g. "beforeEach" is its own, separate
#     entry below, matched literally) -- camelCase and spaced-phrase forms
#     are both listed explicitly rather than derived from one another.
#   - No wildcards. Every term that should match is listed explicitly.
#
# The bare word "setup" is deliberately never used alone -- it matches
# generic environment-setup instructions having nothing to do with test
# fixtures. It only appears inside a phrase ("test setup", "setup and
# teardown").
#
# **v1 -> v2 (2026-10-03): removed "before each"/"after each"/"before
# all"/"after all".** Auditing the real collection's matches (manual
# review -- exactly what this catalog's own match-level persistence
# exists for) found these four spaced phrases collide heavily with
# ordinary English having nothing to do with test lifecycle hooks --
# "before each commit", "after each fix", "before each model request",
# "after each interaction" all matched and were not test-related.
# Measured false-positive rate on real samples: roughly 17-50% across
# the four. The camelCase forms (beforeEach/afterEach/beforeAll/afterAll,
# still below) don't have this problem at all -- they're unambiguous
# identifiers that don't occur in natural prose, so they're kept as the
# only way to catch these four hooks. A hyphenated prose mention
# ("before-each") is lost by this removal, but that's a much rarer
# documentation style than either camelCase or plain English spacing, so
# a clearly worthwhile precision trade. See `prune_removed_keywords()`
# in rq5_agent_file_scan.py for how this was retroactively applied to
# the already-collected db without a from-scratch re-run (removing a
# keyword only ever shrinks a match set, never grows it, so no
# re-fetch from GitHub was needed).
version: 2

# Matched against each repo's root-level tree entries only (no
# subdirectories), case-insensitively -- see find_target_files_at_commit().
target_files:
  - AGENTS.md
  - CLAUDE.md

test_keywords:
  - test
  - tests
  - testing
  - unit test
  - integration test
  - functional test
  - acceptance test
  - end-to-end test
  - e2e test
  - test suite
  - test case
  - test file
  - pytest
  - unittest
  - jest
  - vitest
  - mocha
  - jasmine
  - junit
  - testng

fixture_keywords:
  - fixture
  - fixtures
  - conftest
  - teardown
  - test setup
  - setup and teardown
  - beforeEach
  - afterEach
  - beforeAll
  - afterAll
