categories:
  - code: location
    name: Location
    definition: Where fixtures live or should be placed
  - code: reuse
    name: Reuse
    definition: Using existing fixtures
    note: Also covers guidance that only lists or names the fixtures available.
  - code: creation
    name: Fixture creation
    definition: When and how to create fixtures
    note: '"How" means the tool or procedure that creates a fixture; what the fixture should be like is Fixture design.'
  - code: framework
    name: Framework features
    definition: Which fixture mechanism and scope to use
  - code: cleanup
    name: Cleanup
    definition: Removing what fixtures or tests create
  - code: isolation
    name: Test isolation
    definition: Avoiding state leaks between tests
  - code: test_doubles
    name: Test doubles
    definition: Mocks and stubs handled by fixtures
  - code: design
    name: Fixture design
    definition: Qualities that fixtures should have
  - code: sensitive
    name: Sensitive information
    definition: No real or private data in fixtures
  - code: maintenance
    name: Fixture maintenance
    definition: Keeping fixtures up to date
  - code: non_actionable
    name: Non-actionable mention
    definition: Mentions fixtures without instructions
